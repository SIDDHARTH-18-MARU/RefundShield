name: refundshield-render-validation
services:
  adapter:
    image: refundshield-render:local-rc
    environment:
      REFUNDSHIELD_ORIGINS: https://127.0.0.1:8443
      PORT: "10000"
    networks: [analysis]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.1
    mem_limit: 512000000
    memswap_limit: 512000000
    pids_limit: 64
    stop_grace_period: 20s
    logging:
      driver: local
      options: {max-size: "5m", max-file: "2"}
  edge:
    image: nginx:stable-alpine@sha256:e9b2d7624fd7957f4ed44ae0a272d93fb73aeb8512ba8916f8118ae6143fd115
    depends_on:
      adapter: {condition: service_healthy}
    networks: [analysis, ingress]
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ./nginx.render-test-edge.conf:/etc/nginx/nginx.conf:ro
      - ${REFUNDSHIELD_TLS_DIR:?Set an external LOCAL TEST certificate directory}:/run/secrets:ro
    user: "101:101"
    entrypoint: [nginx, -g, "daemon off;"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.5
    mem_limit: 64m
    pids_limit: 32
    logging:
      driver: local
      options: {max-size: "5m", max-file: "2"}
networks:
  analysis: {internal: true}
  ingress: {}
