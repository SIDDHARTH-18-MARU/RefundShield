name: refundshield-private-rc
services:
  api:
    image: refundshield-api:phase3-private
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      REFUNDSHIELD_ORIGINS: ${REFUNDSHIELD_ORIGINS:?Set the exact reviewed HTTPS origin}
    networks: [analysis]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 64
    init: true
    stop_grace_period: 15s
    logging:
      driver: local
      options: {max-size: "5m", max-file: "2"}
  web:
    image: refundshield-web:phase3-private
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    depends_on:
      api: {condition: service_healthy}
    networks: [analysis, ingress]
    # Private validation only. Public ingress is a separate authorized decision.
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ${REFUNDSHIELD_TLS_DIR:?Set an external certificate directory}:/run/secrets:ro
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 32
    init: true
    stop_grace_period: 15s
    logging:
      driver: local
      options: {max-size: "5m", max-file: "2"}
networks:
  analysis: {internal: true}
  ingress: {}
